<!-- design a registration form for bank account opening and validate the form using javascript. 
The form should have the following fields: name, email, password, confirm password, and a submit button. 
The validation should check for the following:
 1. Name should not be empty.
 2. Email should be in a valid email format.
 3. Password should be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, and one number.
 4. Confirm password should match the password field. -->

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account Registration</title>
    <link rel="stylesheet" href="bank-acc-reg.css">
</head>
<body>
    <div class="container">
        <h1>Bank Account Registration</h1>
        <form action="" id="registrationForm">
            <label for="fname">First Name:</label>
            <input type="text" id="fname" class="form-label" name="fname" placeholder="Enter your first name"><span class="fname_error"></span><br><br>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" class="form-label" name="lname" placeholder="Enter your last name"><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" class="form-label" name="email" placeholder="Enter your email"><br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" class="form-label" name="password" placeholder="Enter your password"><br><br>
            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" class="form-label" name="confirm_password" placeholder="Confirm your password"><br><br>
            <div id="final">
                <input type="submit" id="submitBtn" value="Register">
                <input type="reset" id="resetBtn" value="Reset">
            </div>
            <div id="error-messages" style="color: red;"></div>

        </form>
    <script src="bank-acc-reg.js"></script>
    </div>
</body>
</html>
