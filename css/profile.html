<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="profile.css">
</head>
<body>
  <div class="Box">
    <div class="Box1">
      <div class="Box1a"></div>
      
      <div class="Box1b">
        <img src="https://i.pravatar.cc/96?img=12" alt="Victor Crest" class="Box1c">
      </div>

      <div class="Box1d">
        <h2 class="Box1e">Victor Crest <span class="Box1f">26</span></h2>
        <p class="Box1g">London</p>
      </div>

      <div class="Box1h"></div>

      <div class="Box1i">
        <div class="Box1j">
          <p class="Box1k">80K</p>
          <p class="Box1l">Followers</p>
        </div>
        <div class="Box1j">
          <p class="Box1k">803K</p>
          <p class="Box1l">Likes</p>
        </div>
        <div class="Box1j">
          <p class="Box1k">1.4K</p>
          <p class="Box1l">Photos</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
