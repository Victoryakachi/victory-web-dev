<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <div class="form">
        <div class="whitearea">
            <h2>Colorlib Contact Form</h2>
            <p>Contact us for custom quote</p>
            <form>
                <input type="text" placeholder="Your name">
                <input type="email" name="" placeholder="Your Email Address">
                <input type="tel" placeholder="Your Phone Number(optional)">
                <input type="url" placeholder="Your Web Site (optional)">
                <textarea rows="4"  placeholder="Type your message here..."></textarea>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
