<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT Preview Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="nft.css">
</head>
<body>
  <div class="Box">
    <div class="Box1">
      <img src="media/image-equilibrium.jpg" alt="Equilibrium cube" class="Box1a">

      <h2 class="Box1b">Equilibrium #3429</h2>
      
      <p class="Box1c">Our Equilibrium collection promotes balance and calm.</p>

      <div class="Box1d">
        <div class="Box1e">
          <span><img src="media/icon-ethereum.svg" alt=""></span>
          <span>0.041 ETH</span>
        </div>
        <div class="Box1f">
          <span><img src="media/icon-clock.svg" alt=""></span>
          <span>3 days left</span>
        </div>
      </div>

      <div class="Box1g"></div>

      <div class="Box1h">
        <img src="media/image-avatar.png" alt="Jules Wyvern" class="Box1i">
        <p class="Box1j">Creation of <span class="Box1k">Jules Wyvern</span></p>
      </div>
    </div>
  </div>
</body>
</html>
