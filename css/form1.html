<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form1.css">
    <style>
        .form{
            /* margin: 30px; */
        }
    </style>
</head>
<body>
    <div class="form">
        <div class="whitearea">
            <h2 style="text-align: center;">Contact Us</h2>
            <p style="text-align: center; margin-bottom: 40px;">Fill the form below and send us a message</p>
            <form>
                <label for="fname">Full Name</label>
                <input type="text" placeholder="John Doe">
               Email Address <input type="email" name="" placeholder="you@company.com">
               Phone Number <input type="tel" placeholder="+1 (555) 1234-567">
               Your Message <textarea rows="5" placeholder="Type your message here..."></textarea>
                <button type="submit">Send message</button>
            </form>
        </div>
    </div>
</body>
</html>
