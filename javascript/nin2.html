<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIN Registration Portal</title>
  <link rel="stylesheet" href="nin2.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>National Identity Management System</h1>
      <p>NIN Pre-Registration Form</p>
    </div>

    <form id="ninForm" novalidate>
      
      <div class="section-title">Personal Details</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="fname">First Name <span class="required">*</span></label>
          <input type="text" id="fname" placeholder="First Name">
        </div>

        <div class="form-group">
          <label for="mname">Middle Name</label>
          <input type="text" id="mname" placeholder="Middle Name">
        </div>

        <div class="form-group">
          <label for="lname">Last Name / Surname <span class="required">*</span></label>
          <input type="text" id="lname" placeholder="Surname">
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth <span class="required">*</span></label>
          <input type="date" id="dob">
        </div>

        <div class="form-group">
          <label for="gender">Gender <span class="required">*</span></label>
          <select id="gender">
            <option value="">-- Select Gender --</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div class="form-group">
          <label for="maritalStatus">Marital Status <span class="required">*</span></label>
          <select id="maritalStatus">
            <option value="">-- Select Status --</option>
            <option value="Single">Single</option>
            <option value="Married">Married</option>
            <option value="Divorced">Divorced</option>
            <option value="Widowed">Widowed</option>
          </select>
        </div>
      </div>

      <div class="section-title">Contact Information</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" placeholder="example@domain.com">
        </div>

        <div class="form-group">
          <label for="phone">Phone Number <span class="required">*</span></label>
          <input type="tel" id="phone" placeholder="08012345678">
        </div>

        <div class="form-group full-width">
          <label for="address">Residential Address <span class="required">*</span></label>
          <textarea id="address" rows="2" placeholder="Full residential street address"></textarea>
        </div>

        <div class="form-group">
          <label for="state">State of Origin <span class="required">*</span></label>
          <input type="text" id="state" placeholder="e.g. Lagos, Rivers">
        </div>

        <div class="form-group">
          <label for="lga">LGA of Origin <span class="required">*</span></label>
          <input type="text" id="lga" placeholder="Local Government Area">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnRegister">Submit Pre-Registration</button>
    </form>

    <div id="message"></div>
    <div id="slipContainer" class="slip">
      <h3>Pre-Registration Slip Generated</h3>
      <p><strong>Tracking ID:</strong> <span id="slipTrackingId"></span></p>
      <p><strong>Full Name:</strong> <span id="slipFullName"></span></p>
      <p><strong>Phone:</strong> <span id="slipPhone"></span></p>
      <p><em>Please print or save this tracking ID and visit the nearest enrollment center to complete your biometric capture.</em></p>
    </div>
  </div>

  <script src="nin2.js"></script>
</body>
</html>
