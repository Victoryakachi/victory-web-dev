<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <h2>Atech PortHarcourt</h2>
        <h3>Login Page</h3>
        <form action="">
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="emailOrPhoneOrUsername" placeholder="Enter your email or Phone Number or Username">
            </p>
            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">
            </p>
        </form>
        <p>
            <button id="btnLogin" onclick="userLogin()">Login</button>
        </p>
        <p id="message"></p>
    </div>
    <script src="login.js"></script>
</body>
</html>
