<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="login.css"> 
</head>
<body>
    <div class="container">
        <h2>Atech PortHarcourt</h2>
        <h3>Sign Up Page</h3>
        <form action="">
            <p>
                <label for="fName">First Name:</label>
                <input type="text" id="fName" name="fName" class="fName" placeholder="Enter your first name">
            </p>
            <p>
                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="lname" class="lname" placeholder="Enter your last name">
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" class="email" placeholder="Enter your email">
            </p>
            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" class="password" placeholder="Enter your password">
            </p>
        </form>
        <p>
            <button id="btnLogin" class="btnSignUp" onclick="userLogin()">Sign Up</button>
        </p>
        <p id="message"></p>
    </div>

    <script src="parameter.js"></script>
</body>
</html>
